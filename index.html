<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵活用工零工平台（精简开源版）</title>
<meta name="description" content="免费开源的灵活用工零工平台精简版：任务浏览、一键接单、我的接单查询，后台任务与结算管理，真实增删改查功能，纯前端+localStorage实现，可作为学习或二次开发起点。">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">零工<span class="accent">集市</span></div>
    <a href="admin.html" class="nav-link">进入运营后台 →</a>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>找一份马上能干的零工</h1>
      <p>浏览附近发布的短期任务，先到先得，点击"立即接单"即可锁定任务。这是一个真实可用的精简开源系统，数据保存在你浏览器本地。</p>
    </div>
    <div id="gigGrid" class="gig-grid"></div>

    <div class="lookup-box" id="lookupBox">
      <h2>我的接单</h2>
      <p class="sub">输入你接单时填写的手机号，查询你名下的接单记录和进度。</p>
      <form id="lookupForm" novalidate>
        <div class="lookup-row">
          <input id="lookupPhoneInput" type="tel" placeholder="请输入手机号" required>
          <button type="submit" class="btn btn-primary">查询</button>
        </div>
      </form>
      <div id="lookupResult"></div>
    </div>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <button class="modal-close" id="btnCloseModal">&times;</button>
      <h2 id="modalGigTitle"></h2>
      <p class="sub" id="modalGigMeta"></p>
      <div class="booked-ranges" id="modalGigDesc"></div>
      <div id="modalMsg"></div>
      <form id="claimForm" novalidate>
        <div class="field">
          <label>姓名</label>
          <input id="workerNameInput" type="text" required placeholder="用于联系你的姓名">
        </div>
        <div class="field">
          <label>手机号</label>
          <input id="phoneInput" type="tel" required placeholder="11 位手机号，用于查询接单进度">
        </div>
        <button type="submit" class="btn btn-primary btn-block">立即接单</button>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>

<footer style="margin:40px auto 16px;max-width:1100px;padding:16px 20px 0;border-top:1px solid var(--line,rgba(147,160,184,.18));text-align:center;color:var(--muted,#93A0B8);font-size:13px">精简开源演示 &middot; 完整版：<a href="https://inzyxuashop.com/linghuoyonggong-yuanma.html" target="_blank" rel="noopener" style="color:var(--cyan,#19B8D4);text-decoration:none">灵活用工零工平台源码</a></footer>
